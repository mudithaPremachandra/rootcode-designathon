:root{
  --ink:#16302B; --ink2:#4E625C; --ink3:#5F706B; --line:#D5DDD9; --line2:#E8EDEA;
  --surface:#F2F5F3; --card:#FFFFFF;
  --tea:#1F6F5C; --tea-dark:#14503F; --tea-tint:#E0EEE8;
  --mari:#F0A202; --mari-tint:#FDF0CE; --mari-ink:#6E4A00;
  --cold:#265F90; --cold-tint:#E0ECF6;
  --crit:#B0302A; --crit-tint:#F8E1DE;
  --warn:#A4500F; --warn-tint:#FBE8D6;
  --good:#23703F; --good-tint:#DEF0E4;
  --canvas:#E3E9E5; --canvas-ink:#16302B; --canvas-ink2:#51645E; --rail:#F6F8F7; --rail-line:#D5DDD9;
  --font:'Atkinson Hyperlegible','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --canvas:#0D1916; --canvas-ink:#E4EDE9; --canvas-ink2:#A2B4AE; --rail:#14231F; --rail-line:#263A34; } }
:root[data-theme="dark"]{ --canvas:#0D1916; --canvas-ink:#E4EDE9; --canvas-ink2:#A2B4AE; --rail:#14231F; --rail-line:#263A34; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--canvas-ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mari);outline-offset:2px}
img,svg{max-width:100%}

/* ---------- prototype chrome ---------- */
.top{display:flex;align-items:center;gap:20px;padding:14px 24px;border-bottom:1px solid var(--rail-line);background:var(--rail);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--tea);position:relative}
.brand-mark::after{content:"";position:absolute;left:7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--mari)}
.brand small{font-weight:400;color:var(--canvas-ink2);font-size:13px}
.roles{display:flex;gap:4px;background:var(--canvas);padding:4px;border-radius:12px;margin-left:auto;flex-wrap:wrap}
.roles button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:700;color:var(--canvas-ink2)}
.roles button[aria-current="true"]{background:var(--tea);color:#fff}
.reset{border:1px solid var(--rail-line);background:transparent;border-radius:9px;padding:7px 12px;color:var(--canvas-ink2)}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 62px)}
.rail{background:var(--rail);border-right:1px solid var(--rail-line);padding:18px 16px 40px;overflow:auto}
.rail h2{font-size:13px;color:var(--canvas-ink2);margin:18px 8px 8px;font-weight:700}
.rail h2:first-child{margin-top:0}
.step{display:flex;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:9px;color:var(--canvas-ink);align-items:flex-start}
.step:hover{background:var(--canvas)}
.step[aria-current="true"]{background:var(--canvas);box-shadow:inset 3px 0 0 var(--mari)}
.step .num{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--canvas-ink2);font-size:12px;display:grid;place-items:center;font-weight:700;color:var(--canvas-ink2)}
.step[aria-current="true"] .num{background:var(--mari);border-color:var(--mari);color:#3b2800}
.step span.t{font-size:14px;line-height:1.3}
.step span.t small{display:block;color:var(--canvas-ink2);font-size:12px}
.stage{padding:28px;display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap;min-width:0}
.why{max-width:340px;flex:1 1 280px;color:var(--canvas-ink)}
.why .id{font-size:13px;color:var(--canvas-ink2);font-weight:700}
.why h1{font-size:24px;line-height:1.2;margin:4px 0 12px}
.why p{margin:0 0 14px;color:var(--canvas-ink2)}
.why .nav{display:flex;gap:8px;margin-top:18px}
.why .nav button{border:1px solid var(--rail-line);background:var(--rail);border-radius:10px;padding:9px 14px;font-weight:700;color:var(--canvas-ink)}
.why .nav button.primary{background:var(--mari);border-color:var(--mari);color:#3b2800}
.deskwrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:20px}
.deskwrap .why{max-width:960px;width:100%}
@media (max-width:900px){ .layout{grid-template-columns:1fr} .rail{border-right:0;border-bottom:1px solid var(--rail-line);max-height:220px} .stage{padding:16px} }

/* ---------- device frames ---------- */
.phone{width:390px;height:844px;border-radius:48px;background:var(--ink);padding:11px;box-shadow:0 30px 60px -30px rgba(10,30,25,.45);flex:none}
.phone .scr{width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;position:relative}
.desk{width:1280px;height:800px;border-radius:14px;overflow:hidden;background:var(--surface);color:var(--ink);display:grid;grid-template-columns:208px 1fr;box-shadow:0 30px 60px -30px rgba(10,30,25,.45);border:1px solid var(--line);flex:none;position:relative}
@media (max-width:520px){ .phone{width:100%;height:auto;min-height:760px;border-radius:0;padding:0;box-shadow:none} .phone .scr{border-radius:0;min-height:760px} }
body.shot{background:#fff} body.shot .top,body.shot .rail,body.shot .why{display:none} body.shot .layout{display:block} body.shot .stage{padding:0;display:block} body.shot .deskwrap{display:block}
body.shot .phone{box-shadow:none;border-radius:0;padding:0;background:none;width:390px;height:844px} body.shot .phone .scr{border-radius:0}
body.shot .desk{box-shadow:none;border-radius:0;border:0}

/* ---------- product UI (light, fixed) ---------- */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 6px;font-size:13px;font-weight:700;flex:none}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--good-tint);color:var(--good)}
.net.off{background:var(--warn-tint);color:var(--warn)}
.net::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ahead{padding:6px 20px 12px;flex:none}
.ahead .back{border:0;background:none;padding:0;color:var(--tea);font-weight:700;font-size:14px;margin-bottom:4px}
.ahead h2{margin:0;font-size:22px;line-height:1.2}
.ahead p{margin:3px 0 0;color:var(--ink2);font-size:14px}
.abody{flex:1;overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.afoot{flex:none;padding:12px 16px 22px;background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 4px;font-size:16px}
.card .sub{color:var(--ink2);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--tea);color:#fff;width:100%}
.btn.sec{background:var(--card);color:var(--tea);border:1.5px solid var(--tea)}
.btn.warn{background:var(--crit)}
.btn.sm{padding:8px 12px;font-size:14px;width:auto;border-radius:9px}
.btn:disabled{background:var(--line);color:var(--ink3)}
.link{border:0;background:none;color:var(--tea);font-weight:700;padding:0;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;background:var(--line2);color:var(--ink2)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.cold{background:var(--cold-tint);color:var(--cold)} .pill.crit{background:var(--crit-tint);color:var(--crit)} .pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.good{background:var(--good-tint);color:var(--good)} .pill.tea{background:var(--tea-tint);color:var(--tea-dark)} .pill.mari{background:var(--mari-tint);color:var(--mari-ink)}
.bar{font-size:12.5px}
.bar .bt{display:flex;justify-content:space-between;color:var(--ink2);margin-bottom:3px;gap:6px}
.bar .bt b{color:var(--ink);font-weight:700}
.track{height:7px;border-radius:5px;background:var(--line2);overflow:hidden}
.fill{height:100%;border-radius:5px;background:var(--tea)} .fill.warn{background:var(--warn)} .fill.crit{background:var(--crit)}
.banner{border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-size:14px}
.banner b{display:block;font-size:15px;margin-bottom:2px}
.banner.crit{background:var(--crit-tint);color:#5d1a15;border:1px solid #ecbab4}
.banner.warn{background:var(--warn-tint);color:#5a2c07;border:1px solid #efc9a6}
.banner.mari{background:var(--mari-tint);color:#4a3300;border:1px solid #f1d78e}
.banner.good{background:var(--good-tint);color:#123d24;border:1px solid #b5dcc3}
.banner.cold{background:var(--cold-tint);color:#123a5a;border:1px solid #b8d2e9}
.ico{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.ico.crit{background:var(--crit)} .ico.warn{background:var(--warn)} .ico.mari{background:var(--mari);color:#3b2800} .ico.good{background:var(--good)} .ico.cold{background:var(--cold)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .nm{font-weight:700}
.li .mt{font-size:13px;color:var(--ink2)}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface);width:38px;height:38px;font-size:20px;font-weight:700;color:var(--tea)}
.stepper span{min-width:40px;text-align:center;font-weight:700;font-size:16px}
.track-steps{display:flex;gap:4px;margin:10px 0 6px}
.track-steps div{flex:1;height:6px;border-radius:4px;background:var(--line2)}
.track-steps div.on{background:var(--tea)} .track-steps div.cur{background:var(--mari)} .track-steps div.bad{background:var(--crit)}

  ['Normal day, one order end to end', [

const WHY = {
SM1:['Store manager','Place order','Store managers phone or message orders today and never know whether they landed. This screen replaces that with a structured order counted in cases and crates, not cubic metres: Waypoint works out weight and volume itself. Fresh outlets see dry and chilled goods as two orders on one screen, matching how the brief says they order and how chilled goods need a refrigerated vehicle. The 16:00 cutoff is a live countdown; after it, the order visibly joins the next run instead of silently missing it. Confirmation returns order numbers the manager can quote.'],
SM2:['Store manager','Deliveries','The manager\u2019s real question is when to have staff at the back door. Each order reads like a parcel tracker: one status line, one arrival window, one suggested action. When the dispatcher defers an order, the notice arrives here with a plain-language reason and the new date, so the store hears it before the truck fails to show. Deferrals carry the same red marker the dispatcher uses, so the language stays consistent across roles.'],
D3B:['Dispatcher','Trip check: blocked move','When the dispatcher tries to place a deferred order, the same panel validates the move. Here Gampola\u2019s dry order would overfill VEH053 by 1.3 m\u00b3, so the move is blocked with the exact rule and number, and the system offers a swap that passes every check.'],
SM1C:['Store manager','Order confirmed','Confirmation is the fix for the brief\u2019s \u201cno confirmation\u201d pain: two order numbers, what happens next and when to expect an arrival time.'],
Dr4S:['Driver','Synced','When the signal returns, the queue drains and the driver sees every record confirmed by dispatch, with the time it arrived.'],
SM3:['Store manager','Confirm receipt','Closing the loop turns the driver\u2019s record into something the store can act on. The screen compares what was ordered with what the driver recorded and shows the proof photo and receiver name. A shortfall flagged by the loader before departure appears already explained, so the store does not raise a dispute for a known gap. One tap confirms; \u201cReport an issue\u201d captures item, quantity and a photo for dispatch.'],
D1:['Dispatcher','Order queue at cutoff','At 16:00 every confirmed order from all three brands lands in one queue instead of a spreadsheet re-keyed from phone calls. The header puts demand against capacity for each limiting resource \u2014 refrigerated space, dry-box space, van-only stops and fuel \u2014 so the dispatcher sees the size of the squeeze before planning. Badges carry the constraints that used to live in one person\u2019s head: chilled, van-only, mall windows, fragile items, and outlets skipped on the previous run.'],
D2:['Dispatcher','Plan board','The hero screen. The system proposes trips per vehicle that already satisfy the operating rules; the dispatcher reviews and adjusts. Each trip shows the four limits that matter together \u2014 weight, volume, time budget and weekly fuel \u2014 because a trip can fail any one of them. A banner names the day\u2019s bottleneck in one sentence. Deferred orders sit beside the plan rather than in a separate report, so the trade-off is visible at the moment of deciding.'],
D3:['Dispatcher','Trip check','Explainability is the difference between a plan the dispatcher trusts and one they override blindly. Opening a trip lists every constraint check with the real numbers, including how the 124-minute trip time is built from outbound travel, travel between stops and handling. When a move is impossible, the same panel names the rule that fails and suggests vehicles that would pass, so validation teaches rather than just blocks.'],
D4:['Dispatcher','Deferral review','Deferral is a decision with consequences, so it gets a record. Every deferred order has a reason code, the date the outlet was last served and whether it was skipped yesterday. The system flags repeat skips and proposes a swap with a lower-impact order. Approving sends notices to every affected store in one action, replacing a round of phone calls.'],
D5:['Dispatcher','Live operations','After departure the dispatcher currently learns about problems by phone. This board shows each trip\u2019s progress, late-risk flags and a stream of exceptions from the loader and drivers. Each driver\u2019s last-sync time is shown as a normal state: in hill country, \u201clast synced 22 minutes ago\u201d is expected, not an error, and the board says when its data was last true.'],
D6:['Dispatcher','Capacity outlook','Waypoint cannot see festival and payday peaks coming. One screen projects weekly chilled demand against refrigerated capacity per depot and names the weeks that break it, so hiring or workshop decisions happen weeks ahead. The outlook is deliberately limited to a single screen: it is where the Datathon demand model will surface, and figures are labelled illustrative until then.'],
L1:['Loader','Dock queue','Printed loading lists go stale when the plan changes after printing. The dock tablet shows this depot\u2019s vehicles in departure order with the live plan version and a clear \u201cchanged since print\u201d marker. Large rows and one status per vehicle suit a shared device used with gloves in a cold, noisy dock.'],
L2:['Loader','Load sheet','The brief asks for loading that supports unloading. The sheet lists stops in reverse order \u2014 the last stop loads first, deepest in the truck \u2014 with chilled items grouped per stop. Loaders tick counts with large targets, and the fill bar shows the space left so an overloaded trip is caught at the dock, not on the road.'],
L3:['Loader','Flag a shortfall','Today a missing crate is discovered at the outlet. Here the loader flags it at the dock: item, quantity, missing or damaged, and an optional photo. The flag reaches the dispatcher\u2019s exception feed, pre-warns the store and adjusts the driver\u2019s expected counts, so three roles see the same numbers.'],
L4:['Loader','Release vehicle','Release is the hand-over between dock and road. It summarises checked stops and open flags, confirms the reefer is running, and pushes the trip \u2014 as actually loaded \u2014 to the driver\u2019s phone while it is still on depot wifi.'],
Dr1:['Driver','Today','The driver\u2019s day starts at the depot, where connectivity is good. This screen confirms both trips are saved on the phone and shows the plan version, so a driver heading into the Kandy hills knows the route will not disappear with the signal.'],
Dr2:['Driver','Next stop','Designed for a driver who is safely stopped: one stop, the arrival time against the delivery window, the dock type and access notes that used to be local knowledge, and one primary action. Navigation hands off to Maps rather than being rebuilt. The connection state is always visible.'],
Dr3:['Driver','Record the delivery','Proof of delivery that does not depend on memory. Counts are prefilled from the load sheet, including the loader\u2019s flagged shortfall, so the driver only corrects exceptions. A photo and the receiver\u2019s name complete the record. With no signal, the stop is saved on the phone and queued, and the driver carries on.'],
Dr4:['Driver','Sync status','Offline only works if the driver trusts it. This screen shows exactly what is waiting to upload and when the last sync happened, then confirms when everything has reached dispatch. Photos queue separately, so a slow upload never blocks the next stop.'],
X1:['Driver','Report a problem','The failure starts with the driver noticing the refrigeration is not holding temperature. Reporting is reachable from every stop, with the most time-critical problems listed first. With no signal, the report is queued and a call-dispatch button appears, because a cold-chain failure cannot wait for coverage.'],
X2:['Dispatcher','Incident and recovery options','The hero degradation screen. It separates affected chilled stops from the rest, shows the time left in the Fresh window, and offers recovery options already checked against capacity, time budgets and windows \u2014 each with stops saved, minutes late and stops deferred. An option that breaks a rule is shown as ruled out, with the reason. The dispatcher sees the consequences before approving; the system never re-routes on its own.'],
X3:['Loader','Priority release','Recovery needs the dock. The approved plan puts an urgent card at the top of the loader\u2019s queue: which vehicle, what to prepare and when it must leave. It reuses the release pattern loaders already know, so an unusual morning needs no new training.'],
X4:['Driver','Updated trip','The driver receives the change as a clear instruction \u2014 where to meet, which stops to hand over, what happens next \u2014 with changed stops marked. Accepting updates the stop list; had the driver been offline, the same change would arrive through the sync-conflict screen.'],
X5:['Store manager','Changed delivery notice','The store hears about the fault before its delivery window closes, not after. Only the chilled order is affected; the notice says which vehicle is now coming, the new arrival time against the window, and asks staff to check temperature on receipt, because the brief gives no in-truck temperature data.'],
DZ1:['Driver','Plan changed while offline','In the dead zone the driver keeps recording while dispatch changes the plan. On reconnect, the phone shows what changed, who changed it and when, and asks the driver to accept the new stop list, so two versions of the truth never quietly coexist.']

}

function outlookChart(){

function stopDots(cur){ return `<div class="card"><div class="list">${TRIP.map(s=>`<div class="li"><span class="seqno ${s.n===cur?'hero':''}" style="${s.n<cur?'background:var(--tea)':s.n>cur?'background:var(--line);color:var(--ink2)':''}">${s.n<cur?'\u2713':s.n}</span><div class="grow"><div class="nm">${s.name}</div><div class="mt">${s.n<cur?'Delivered':('ETA '+s.eta+', window '+s.win)}</div></div></div>`).join('')}</div></div>`; }
SCR.Dr2 = () => { const s=TRIP[2]; return phone({time:'05:58', net:'off', title:'Stop 3 of 4', sub:'Trip 1, Fresh, Kandy',
  body:`<div class="card"><div class="small muted">${s.id}</div><h3 style="font-size:20px">Waypoint Fresh ${s.name}</h3>
   <div class="row" style="margin-top:8px"><div><div class="small muted">Arrive</div><div class="big">${s.eta}</div></div><div style="text-align:right"><div class="small muted">Window</div><b>${s.win}</b><div>${pill('90 min spare','good')}</div></div></div>
   <div class="list" style="margin-top:6px"><div class="li"><span class="grow">Unloading</span><b>${s.dock}</b></div><div class="li"><span class="grow">Access</span><b>${s.note}</b></div><div class="li"><div class="grow">Goods<div class="mt">Yoghurt 9 of 10, flagged at dock</div></div><b>33 cases, chilled</b></div></div></div>${stopDots(3)}`,
  foot:`<button class="btn" data-go="Dr3">Arrived at stop</button><div class="row"><button class="btn sec" style="flex:1" data-act="stub" data-msg="Opens Google Maps at the outlet (prototype)">Open in Maps</button><button class="btn sec" style="flex:1;border-color:var(--crit);color:var(--crit)" data-go="X1">Report a problem</button></div>`}); };
SCR.Dr3 = () => phone({time:'06:04', net:'off', back:'Dr2', backLabel:'Stop 3', title:'Record the delivery', sub:'Peradeniya, WF-30921',
  body:`<div class="seg">${['Delivered','Part delivered','Not delivered'].map(o=>`<button data-act="outcome" data-v="${o}" aria-pressed="${S.outcome===o}">${o}</button>`).join('')}</div>
  <div class="card"><div class="list">${[['Fresh milk 1 L','12 of 12'],['Yoghurt cups','9 of 10'],['Whole chicken','8 of 8'],['Cheese slices','4 of 4']].map(r=>`<div class="li"><span class="grow">${r[0]}${r[1]==='9 of 10'?'<div class="mt">Short flagged at dock</div>':''}</span><b>${r[1]}</b><button class="link" data-act="stub" data-msg="Opens the count editor for ${r[0]} (prototype)" aria-label="Edit ${r[0]} count">Edit</button></div>`).join('')}</div></div>
  <button class="photo ${S.photo?'done':''}" data-act="photo" style="width:100%">${S.photo?'':'Take a photo of the goods'}</button>
  <label class="field">Received by<input value="R. Jayasinghe" autocomplete="off"></label>
  <div class="sig" role="img" aria-label="Receiver signature"><svg viewBox="0 0 330 70" style="width:100%;height:100%"><path d="M20 48 C 40 10, 60 60, 80 30 S 120 50, 140 25 S 180 55, 210 35 S 260 20, 300 40" fill="none" stroke="#16302B" stroke-width="2.5" stroke-linecap="round"/></svg></div>`,
  foot:`<div class="small muted">No signal. This stop is saved on the phone and syncs later.${S.photo?'':' A photo of the goods is required to complete the stop.'}</div><button class="btn" data-act="complete" ${S.photo?'':'disabled aria-disabled="true"'}>Complete stop</button>`});
SCR.Dr4 = () => {
  const q=[['Stop 2, Kandy City','Delivered 05:46'],['Stop 3, Peradeniya','Delivered 06:04, 33 of 34'],['Photo, Peradeniya','1.1 MB'],['Receiver and signature','Peradeniya']];
  return phone({time: S.synced?'06:19':'06:10', net: S.synced?'4G':'off', title: S.synced?'All synced':'Waiting to sync', sub: S.synced?'Dispatch has every record.':'Last sync 05:31 at Katugastota.',
  body:`${S.synced?`<div class="banner good"><span aria-hidden="true" class="ico good">\u2713</span><div><b>4 records reached dispatch at 06:19</b>All records made offline were kept.</div></div>`:`<div class="banner warn"><span aria-hidden="true" class="ico warn">!</span><div><b>No signal</b>Records are saved on this phone and upload automatically when the signal returns.</div></div>`}
  <div class="card"><div class="list">${q.map(r=>`<div class="li"><span class="chk ${S.synced?'on':''}">${S.synced?'\u2713':''}</span><div class="grow"><div class="nm">${r[0]}</div><div class="mt">${r[1]}</div></div>${S.synced?pill('Synced','good'):pill('Queued','warn')}</div>`).join('')}</div></div>`,
  foot: S.synced?`<button class="btn" data-go="D5">Next stop: Tennekumbura</button>`:`<button class="btn sec" data-act="sync">Signal back: sync now</button>`});
};
SCR.Dr4S = () => SCR.Dr4();
SCR.X1 = () => phone({time:'05:22', net:'4G', back:'Dr2', backLabel:'Trip', title:'Report a problem', sub:'VEH047 trip 1, between stops 1 and 2',
  body:`${S.reported?`<div class="banner good"><span aria-hidden="true" class="ico good">\u2713</span><div><b>Sent to dispatch at 05:22</b>Keep the doors closed. Dispatch is choosing a recovery; new instructions will appear here.</div></div>`:''}
  <div class="card"><div class="list"><div role="radiogroup" aria-label="Problem type">${['Refrigeration not holding temperature','Vehicle breakdown','Road blocked or flooded','Outlet closed or can\u2019t unload','Something else'].map((o,i)=>{const on=(S.prob??0)===i; return `<div class="li"><button class="opt-btn" role="radio" aria-checked="${on}" data-act="prob" data-v="${i}"><span class="chk ${on?'on':''}" style="border-radius:50%" aria-hidden="true">${on?'\u2713':''}</span><span class="grow ${on?'nm':''}">${o}</span></button></div>`}).join('')}</div></div></div>
  <label class="field">What does the display show?<input value="9\u00b0C, set to 3\u00b0C"></label><div class="small muted">3 chilled stops still on board: Kandy City, Peradeniya, Tennekumbura.</div>`,
  foot: S.reported?`<button class="btn sec" data-act="stub" data-msg="Calling the Kandy dispatch desk (prototype)">Call dispatch</button>`:`<button class="btn warn" data-act="report">Send to dispatch now</button><button class="btn sec" data-act="stub" data-msg="Calling the Kandy dispatch desk (prototype)">Call dispatch</button>`});
SCR.X4 = () => phone({time:'05:33', net:'4G', title:'Plan changed', sub:'By dispatch (Nimal) at 05:31: refrigeration fault',
  body:`<div class="banner crit"><span aria-hidden="true" class="ico crit">!</span><div><b>Hand over the chilled stops</b>VEH052 takes Kandy City, Peradeniya and Tennekumbura.</div></div>
  <div class="card"><h3>What to do now</h3><div class="list">${[['Drive to Katugastota junction','4 min'],['Meet VEH052, Chaminda S.','about 05:50'],['Hand over 80 cases for 3 stops','15 min'],['Take VEH047 to the hub workshop','Trip 2 moves to VEH053']].map((r,i)=>`<div class="li"><span class="seqno">${i+1}</span><span class="grow">${r[0]}</span><span class="small muted">${r[1]}</span></div>`).join('')}</div></div>
  <div class="card"><h3>Stops</h3><div class="list">${TRIP.map(s=>`<div class="li"><span class="grow ${s.n>1?'strike':''}">${s.n}. ${s.name}</span>${s.n===1?pill('Delivered','good'):pill('Now VEH052','mari')}</div>`).join('')}</div></div>`,
  foot: S.x4?`<div class="banner good"><span aria-hidden="true" class="ico good">\u2713</span><div><b>Accepted 05:33</b></div></div>`:`<button class="btn" data-act="x4">Accept and go to meeting point</button>`});
SCR.DZ1 = () => phone({time:'06:19', net:'4G', title:'Plan changed while offline', sub:'Back online at 06:19. 4 records synced.',
  body:`<div class="banner warn"><span aria-hidden="true" class="ico warn">!</span><div><b>Stop 4 moved to VEH052</b>At 05:44 Nimal moved Tennekumbura (OUT044) to VEH052 because VEH047 was 25 min behind and the outlet\u2019s window closes at 07:15.</div></div>
  <div class="card"><div class="grid2" style="gap:10px"><div><div class="small muted">Stored on phone</div><div class="list small">${TRIP.map(s=>`<div class="li">${s.n}. ${s.name}</div>`).join('')}</div></div><div><div class="small muted">Now</div><div class="list small">${TRIP.map(s=>`<div class="li ${s.n===4?'strike':''}">${s.n}. ${s.name}</div>`).join('')}</div></div></div></div>
  <div class="small muted">Records for stops 2 and 3 were kept. The trip now ends after Peradeniya, followed by return to Kandy hub.</div>
  ${S.dz?`<div class="banner good"><span aria-hidden="true" class="ico good">\u2713</span><div><b>Updated plan accepted</b></div></div>`:''}`,
  foot: S.dz?'':`<button class="btn" data-act="dz">Accept updated plan</button>`});

const QTY0 = Object.fromEntries([...CHILLED,...DRY].map(l=>[l.k,l.qty]));
const S0 = () => ({cur:'SM1', qty:{...QTY0}, placed:false, planApproved:false, swap:false, drawer:null, depot:'Kandy', qf:'all', ackDefer:false,
  ticks:{}, shortfall:false, released:false, started:false, outcome:'Delivered', photo:false, delivered:false, synced:false,
  receipt:false, issue:false, seg:{}, yog:9, prob:0, confirm:null, issueSent:false, incident:false, reported:false, rec:null, x3:false, x4:false, x5:false, dz:false, toast:null});
let S = S0();
const ALL4 = {1:true,2:true,3:true,4:true};
const PRE = {
  SM1C:{placed:true}, SM2:{placed:true,planApproved:true,swap:true},
  SM3:{placed:true,planApproved:true,swap:true,released:true,started:true,delivered:true,synced:true,shortfall:true,photo:true},
  D2:{placed:true}, D3:{placed:true,drawer:'VEH047'}, D3B:{placed:true,drawer:'block'}, D4:{placed:true},
  D5:{placed:true,planApproved:true,swap:true,released:true,started:true,delivered:true,synced:true,shortfall:true,photo:true}, D6:{placed:true,planApproved:true},
  L1:{placed:true,planApproved:true,swap:true}, L2:{placed:true,planApproved:true,swap:true}, L3:{placed:true,planApproved:true,swap:true},
  L4:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true},
  Dr1:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true,released:true},
  Dr2:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true,released:true,started:true},
  Dr3:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true,released:true,started:true},
  Dr4:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true,released:true,started:true,delivered:true,photo:true},
  Dr4S:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true,released:true,started:true,delivered:true,photo:true,synced:true},
  X1:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true,released:true,started:true},
  X2:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true,released:true,started:true,incident:true,reported:true},
  X3:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true,released:true,started:true,incident:true,reported:true,rec:'A'},
  X4:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true,released:true,started:true,incident:true,reported:true,rec:'A',x3:true},
  X5:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true,released:true,started:true,incident:true,reported:true,rec:'A',x3:true,x4:true},
  DZ1:{placed:true,planApproved:true,swap:true,ticks:ALL4,shortfall:true,released:true,started:true,delivered:true,photo:true,synced:true}
};
const ORDER = WALK.flatMap(g=>g[1].map(s=>s[0]));
const ROLE_OF = id => WHY[id][0];
const ROLE_KEYS = [['Store manager','SM1'],['Dispatcher','D1'],['Loader','L1'],['Driver','Dr1']];
const lastByRole = {};
const isDesk = id => ROLE_OF(id)==='Dispatcher';

function go(id, usePreset=true){
  const p = usePreset ? (PRE[id]||{}) : {};
  for(const k in p){ if(k==='drawer'||k==='rec'||k==='ticks') S[k]=p[k]; else if(p[k]) S[k]=true; }
  if(!(id in PRE) && ['D1','D2','D4','D5','D6'].includes(id)) S.drawer=null;
  if(id==='D2') S.drawer=null;
  if(id==='SM1' && S.placed){ /* keep confirmation */ }
  S.cur=id; lastByRole[ROLE_OF(id)]=id; S.issue=false; S.confirm=null; render(); 
  const st=document.querySelector('.stage'); if(st) st.scrollTop=0; window.scrollTo(0,0);
}
function toast(m){ S.toast=m; render(); clearTimeout(toast.t); toast.t=setTimeout(()=>{S.toast=null;render();},2600); }

const ACT = {
  qty:(el)=>{ const k=el.dataset.k; S.qty[k]=Math.max(0,S.qty[k]+Number(el.dataset.d)); },
  place:()=>{ S.placed=true; },
  ackDefer:()=>{ S.ackDefer=true; },
  receipt:()=>{ S.receipt=true; }, issue:()=>{ S.issue=true; }, issueSend:()=>{ S.issue=false; S.issueSent=true; },
  qf:(el)=>{ S.qf=el.dataset.v; },
  depot:(el)=>{ S.depot=el.dataset.v; S.drawer=null; },
  drawer:(el)=>{ const v=el.dataset.v||null; S.drawer = v; if(v==='VEH047'){S.cur='D3';} else if(v==='block'){S.cur='D3B';} else if(S.cur==='D3'||S.cur==='D3B'){S.cur='D2';} },
  swap:()=>{ S.swap=true; return 'Swap applied. Gampola is back on VEH053.'; },
  approve:()=>{ S.confirm='approve'; },
  tick:(el)=>{ const n=el.dataset.v; S.ticks={...S.ticks,[n]:!S.ticks[n]}; },
  flag:()=>{ S.shortfall=true; S.cur='L2'; return 'Flag sent to dispatch and Peradeniya.'; },
  release:()=>{ S.released=true; },
  start:()=>{ S.started=true; S.cur='Dr2'; },
  outcome:(el)=>{ S.outcome=el.dataset.v; },
  photo:()=>{ S.photo=true; },
  complete:()=>{ S.delivered=true; S.cur='Dr4'; },
  sync:()=>{ S.synced=true; },
  report:()=>{ S.reported=true; S.incident=true; },
  rec:(el)=>{ S.confirm=null; S.rec=el.dataset.v; return el.dataset.v==='A'?'Option A approved. Dock, drivers and 3 stores notified.':'Option B chosen. 3 stores notified.'; },
  x3:()=>{ S.x3=true; }, x4:()=>{ S.x4=true; }, x5:()=>{ S.x5=true; }, dz:()=>{ S.dz=true; },
  seg:(el)=>{ S.seg={...S.seg,[el.dataset.g]:el.dataset.v}; },
  yog:(el)=>{ S.yog=Math.min(10,Math.max(0,S.yog+Number(el.dataset.d))); },
  prob:(el)=>{ S.prob=Number(el.dataset.v); },
  stub:(el)=> el.dataset.msg,
  askA:()=>{ S.confirm='recA'; },
  approveYes:()=>{ S.confirm=null; S.planApproved=true; return 'Plan v3 approved. 30 stores notified.'; },
  cancel:()=>{ S.confirm=null; },
  reset:()=>{ S=S0(); }
};
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-go],[data-act]'); if(!t) return;
  if(t.dataset.go){ go(t.dataset.go, !t.closest('.phone,.desk')); return; }
  const f = ACT[t.dataset.act]; if(!f) return;
  const msg = f(t); lastByRole[ROLE_OF(S.cur)]=S.cur; msg ? toast(msg) : render();
});

function rail(){
  let n=0;
  return WALK.map(g=>`<h2>${g[0]}</h2>`+g[1].map(s=>{ n++; return `<button class="step" data-go="${s[0]}" aria-current="${S.cur===s[0]||(S.cur==='D3B'&&s[0]==='D3')||(S.cur==='SM1C'&&s[0]==='SM1')||(S.cur==='Dr4S'&&s[0]==='Dr4')}"><span class="num">${n}</span><span class="t">${s[1]}<small>${ROLE_OF(s[0])}. ${s[2]}</small></span></button>`; }).join('')).join('');
}
function why(){
  const w = WHY[S.cur], base = S.cur==='D3B'?'D3':S.cur==='SM1C'?'SM1':S.cur==='Dr4S'?'Dr4':S.cur;
  const i = ORDER.indexOf(base), prev = ORDER[i-1], next = ORDER[i+1];
  return `<aside class="why"><div class="id">${base}. ${w[0]}</div><h1>${w[1]}</h1><p>${w[2]}</p>
  <div class="nav">${prev?`<button data-go="${prev}">Previous</button>`:''}${next?`<button class="primary" data-go="${next}">Next: ${WHY[next][1]}</button>`:''}</div></aside>`;
}
function render(){
  const shot = document.body.classList.contains('shot');
  const scr = SCR[S.cur]();
  const role = ROLE_OF(S.cur);
  document.getElementById('app').innerHTML = `<a class="skip" href="#stage">Skip to the prototype screen</a>
  <header class="top"><div class="brand"><span class="brand-mark"></span><span>Waypoint Nexus <small>Protocol_Nine, Designathon prototype, Tech-Triathlon 2026</small></span></div>
   <div class="roles" role="group" aria-label="View as">${ROLE_KEYS.map(r=>`<button data-go="${lastByRole[r[0]]||r[1]}" aria-current="${role===r[0]}">${r[0]}</button>`).join('')}</div>
   <button class="reset" data-act="reset">Reset</button></header>
  <div class="layout"><nav class="rail" aria-label="Walkthrough">${rail()}</nav>
   <main class="stage" id="stage" tabindex="-1">${isDesk(S.cur)?`<div class="deskwrap"><div class="deskscale">${scr}</div>${why()}</div>`:`${scr}${why()}`}</main></div>`;
  if(!shot) fit();
}
function fit(){
  const d=document.querySelector('.desk'); if(!d) return;
  const st=document.querySelector('.stage'); const avail = st.clientWidth - 56;
  d.style.zoom = Math.min(1, avail/1280);
}
window.addEventListener('resize', ()=>{ if(!document.body.classList.contains('shot')) fit(); });
(function init(){
  const q = new URLSearchParams(location.search), shot=q.get('shot');
  if(shot && SCR[shot]){ document.body.classList.add('shot'); go(shot); return; }
  go('SM1'); S.placed=false; render();
})();
</script></body></html>
